name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15

      - name: Check formatting
        run: |
          find include src -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-15 --dry-run --Werror

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15-dev libclang-15-dev clang-tidy-15

      - name: Configure (compile_commands.json)
        run: |
          mkdir build && cd build
          cmake -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
        env:
          CC: clang-15
          CXX: clang++-15

      - name: clang-tidy
        run: |
          find src -name '*.cpp' -print0 \
            | xargs -0 -I {} clang-tidy-15 {} -p build --format-style=file 2>/dev/null || true
